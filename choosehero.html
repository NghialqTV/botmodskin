<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Chọn Hero • NghĩaLQ TV</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#080d20;--panel:#0d1730;--panel2:#101d3c;--line:#164b63;--cyan:#27dcff;--pink:#ff3d9a;--text:#f3f7ff;--muted:#7e8eaf;--green:#36e9a5}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;background:radial-gradient(circle at 50% -10%,#112a49 0,#080d20 46%,#060a17 100%);color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{padding-bottom:88px}.wrap{max-width:760px;margin:auto;padding:14px 14px 30px}.top{background:linear-gradient(135deg,#0d1b38,#0b1229);border:1px solid #15506a;border-radius:24px;padding:16px;box-shadow:0 0 30px #0008}.brand{display:flex;align-items:center;gap:12px}.avatar{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;font-size:29px;font-weight:900;background:linear-gradient(145deg,#d42b8c,#17203f);border:3px solid var(--cyan);box-shadow:0 0 18px #1edfff55}.brand b{font-size:20px}.tag{color:var(--cyan);font-size:12px;font-weight:800}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}.stat{border:1px solid #1b536b;border-radius:18px;padding:11px 5px;text-align:center;background:#0c1730}.num{font-size:26px;font-weight:900;color:var(--cyan)}.stat:nth-child(3) .num{color:var(--pink)}.lbl{font-size:11px;color:var(--muted);font-weight:800;letter-spacing:1px}.slot{display:flex;justify-content:space-between;margin-top:13px;color:var(--muted);font-weight:800;font-size:12px}.bar{height:7px;background:#202b48;border-radius:99px;margin-top:8px;overflow:hidden}.fill{height:100%;width:0;background:linear-gradient(90deg,var(--cyan),var(--pink));transition:.25s}.title{font-size:30px;font-weight:950;margin:24px 4px 2px;letter-spacing:-1px}.title span{color:var(--cyan)}.sub{color:var(--muted);margin:0 4px 16px}.search{display:flex;align-items:center;gap:10px;background:#0b142c;border:1px solid #164a61;border-radius:20px;padding:14px 16px}.search svg{width:22px;fill:none;stroke:var(--cyan);stroke-width:2}.search input{width:100%;background:none;border:0;outline:0;color:var(--text);font-size:17px}.search input::placeholder{color:#7785a5}.letters{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:14px}.letter{min-height:82px;border:1px solid #16465f;border-radius:18px;background:linear-gradient(145deg,#172641,#0c1429);position:relative;color:#f5f8ff;font-size:30px;font-weight:900;display:grid;place-items:center;box-shadow:inset 0 1px #ffffff08}.letter small{position:absolute;right:9px;top:7px;color:#7888a8;font-size:12px}.letter.active{border-color:var(--cyan);box-shadow:0 0 18px #21ddff22}.heroGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:14px}.hero{padding:15px;border:1px solid #16465f;border-radius:18px;background:linear-gradient(145deg,#15233f,#0a1227);min-height:88px;text-align:left;position:relative}.hero:active,.skin:active{transform:scale(.985)}.hero .count{position:absolute;right:10px;top:8px;color:#8090b0;font-size:12px;font-weight:900}.hero .hletter{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:#0e1b35;border:1px solid #23617a;color:var(--cyan);font-weight:950;font-size:19px}.hero b{display:block;margin-top:8px;font-size:15px}.hero small{color:var(--muted)}.skinList{display:grid;gap:10px}.skin{border:1px solid #16465f;border-radius:18px;background:#0d1830;padding:14px;display:flex;align-items:center;gap:12px}.skin .sid{margin-left:auto;color:#657694;font-size:11px}.skin .check{width:26px;height:26px;border-radius:50%;border:1px solid #31516b;display:grid;place-items:center;color:transparent}.skin.selected{border-color:#1c9b91;background:#10283a}.skin.selected .check{background:var(--green);border-color:var(--green);color:#071428}.back{border:0;background:none;color:var(--cyan);font-weight:800;padding:0;margin:4px 0 16px;font-size:15px}.empty{text-align:center;color:var(--muted);padding:45px 10px}.bottom{position:fixed;left:0;right:0;bottom:0;padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:#070c1bd9;backdrop-filter:blur(16px);border-top:1px solid #123b53}.bottomInner{max-width:760px;margin:auto;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.bottom button{border:1px solid #143f57;background:#0a132a;color:#7787a8;border-radius:18px;padding:10px 4px;font-weight:800}.bottom button.active{color:var(--cyan);border-color:#1ba9c7;background:#102a3b}.action{position:fixed;left:14px;right:14px;bottom:76px;max-width:732px;margin:auto;z-index:4}.run{width:100%;border:1px solid #23dca9;background:linear-gradient(90deg,#0d7f70,#123d4a);color:white;border-radius:18px;padding:15px;font-weight:950;font-size:16px;box-shadow:0 8px 25px #0007}.hidden{display:none!important}.toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:#14203a;border:1px solid #22516b;border-radius:99px;padding:9px 15px;z-index:9;font-size:13px}.loading{text-align:center;color:var(--muted);padding:35px}.error{padding:16px;border:1px solid #6a244d;background:#26132a;border-radius:16px;color:#ff9bc8}
@media(min-width:620px){.heroGrid{grid-template-columns:repeat(3,1fr)}.letters{grid-template-columns:repeat(8,1fr)}}
</style>
</head>
<body>
<div id="app" class="wrap">
  <section class="top">
    <div class="brand"><div class="avatar">T</div><div><b>TRUNG NGHĨA</b><div class="tag">@NghialqTV • MOD SKIN</div></div></div>
    <div class="stats"><div class="stat"><div id="heroCount" class="num">0</div><div class="lbl">TƯỚNG</div></div><div class="stat"><div id="skinCount" class="num">0</div><div class="lbl">SKIN</div></div><div class="stat"><div id="selectedCount" class="num">0</div><div class="lbl">ĐÃ CHỌN</div></div></div>
    <div class="bar"><div id="fill" class="fill"></div></div><div class="slot"><span id="slotText">0 / 20 SLOT</span><span id="status">SẴN SÀNG</span></div>
  </section>
  <main id="main"><div class="loading">⏳ Đang tải danh sách Hero...</div></main>
</div>
<div id="action" class="action hidden"><button class="run" onclick="sendSelection()">🚀 XÁC NHẬN & CHỌN SKIN (<span id="runCount">0</span>)</button></div>
<div class="bottom"><div class="bottomInner"><button id="tabHero" class="active" onclick="showHeroes()">☆<br>TƯỚNG</button><button onclick="showCart()">🛒<br>GIỎ</button><button onclick="showInfo()">☼<br>KHÁC</button></div></div>
<script>
const tg=window.Telegram?.WebApp; tg?.ready(); tg?.expand();
const MAX=20;
let data={}, selected=new Map(), currentHero=null, activeLetter='ALL';
const esc=s=>String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
function parseSkinTxt(txt){let out={},hero=null; for(const raw of txt.split(/\r?\n/)){const line=raw.trim();if(!line)continue;if(line.endsWith(':')){hero=line.slice(0,-1).trim();out[hero]={};continue} const m=line.match(/^(\S+)\s+-\s+(.+)$/);if(hero&&m)out[hero][m[2].trim()]=m[1].trim();}return out}
async function load(){
 try{
   const r=await fetch('./skin.txt',{cache:'no-store'}); if(!r.ok)throw new Error('HTTP '+r.status); data=parseSkinTxt(await r.text());
   renderHeroes();
 }catch(e){document.getElementById('main').innerHTML='<div class="error">❌ Không tải được <b>skin.txt</b>.<br><br>Hãy đặt file <b>skin.txt</b> cùng thư mục với trang Mini App.</div>'}
}
function stats(){let heroes=Object.keys(data);let skins=heroes.reduce((n,h)=>n+Object.keys(data[h]).length,0);document.getElementById('heroCount').textContent=heroes.length;document.getElementById('skinCount').textContent=skins;document.getElementById('selectedCount').textContent=selected.size;document.getElementById('slotText').textContent=`${selected.size} / ${MAX} SLOT`;document.getElementById('runCount').textContent=selected.size;document.getElementById('fill').style.width=(selected.size/MAX*100)+'%';document.getElementById('status').textContent=selected.size>=MAX?'ĐẦY':'SẴN SÀNG';document.getElementById('action').classList.toggle('hidden',selected.size===0)}
function letters(){let letters=[...'ABCDEFGHIJKLMNOPQRSTUVWXYZ'];return `<div class="letters"><button class="letter ${activeLetter==='ALL'?'active':''}" onclick="filterLetter('ALL')"><span>★</span><small>${Object.keys(data).length}</small></button>${letters.map(l=>{let n=Object.keys(data).filter(h=>h[0]?.toUpperCase()===l).length;return `<button class="letter ${activeLetter===l?'active':''}" onclick="filterLetter('${l}')"><span>${l}</span><small>${n}</small></button>`}).join('')}</div>`}
function renderHeroes(){currentHero=null;activeLetter=activeLetter||'ALL';document.getElementById('tabHero').classList.add('active');let heroes=Object.keys(data).filter(h=>activeLetter==='ALL'||h[0]?.toUpperCase()===activeLetter);document.getElementById('main').innerHTML=`<h1 class="title">CHỌN <span>TƯỚNG</span></h1><p class="sub">Lọc theo chữ cái hoặc tìm nhanh</p><label class="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-4-4"></path></svg><input id="q" placeholder="Tìm tướng hoặc skin..." oninput="search(this.value)"></label>${letters()}<div id="heroGrid" class="heroGrid">${heroCards(heroes)}</div>`;stats()}
function heroCards(heroes){if(!heroes.length)return '<div class="empty">Không tìm thấy Hero phù hợp.</div>';return heroes.map(h=>`<button class="hero" onclick="openHero(${JSON.stringify(h)})"><span class="count">${Object.keys(data[h]).length}</span><span class="hletter">${esc(h[0]||'?')}</span><b>${esc(h)}</b><small>Chọn skin →</small></button>`).join('')}
function filterLetter(l){activeLetter=l;renderHeroes()}
function search(q){q=q.trim().toLowerCase();let heroes=Object.keys(data).filter(h=>!q||h.toLowerCase().includes(q)||Object.keys(data[h]).some(s=>s.toLowerCase().includes(q)));document.getElementById('heroGrid').innerHTML=heroCards(heroes)}
function openHero(hero){currentHero=hero;document.getElementById('main').innerHTML=`<button class="back" onclick="renderHeroes()">← Quay lại danh sách Tướng</button><h1 class="title">${esc(hero)}</h1><p class="sub">${Object.keys(data[hero]).length} skin • Chọn tối đa ${MAX - selected.size} skin nữa</p><div id="skinList" class="skinList">${Object.entries(data[hero]).map(([name,id])=>skinCard(hero,name,id)).join('')}</div>`;document.getElementById('tabHero').classList.add('active');stats()}
function skinCard(hero,name,id){let key=String(id),yes=selected.has(key);return `<button class="skin ${yes?'selected':''}" onclick="toggleSkin(${JSON.stringify(hero)},${JSON.stringify(name)},${JSON.stringify(id)})"><span class="hletter">${esc(hero[0]||'?')}</span><span><b>${esc(name)}</b><br><small>${esc(hero)}</small></span><span class="sid">#${esc(id)}</span><span class="check">✓</span></button>`}
function toggleSkin(hero,name,id){id=String(id);if(selected.has(id)){selected.delete(id)}else{if(selected.size>=MAX){toast('⚠️ Đã đủ 20 skin');return}selected.set(id,{id,hero,name})}openHero(hero);stats()}
function showCart(){document.getElementById('tabHero').classList.remove('active');document.getElementById('main').innerHTML=`<h1 class="title">KHOANG <span>CHỨA</span></h1><p class="sub">Tối đa ${MAX} skin • mỗi tướng có thể chọn nhiều skin</p>${selected.size?`<div class="skinList">${[...selected.values()].map(x=>skinCard(x.hero,x.name,x.id)).join('')}</div>`:'<div class="empty">📦<br><br>Khoang chứa trống.<br>Qua tab TƯỚNG để bắt đầu.</div>'}`;stats()}
function showHeroes(){renderHeroes()}
function showInfo(){document.getElementById('tabHero').classList.remove('active');document.getElementById('main').innerHTML='<h1 class="title">HỆ <span>THỐNG</span></h1><p class="sub">Thông tin & tùy chọn</p><div class="skinList"><div class="skin"><span class="hletter">☀</span><span><b>Chế độ mod</b><br><small>Normal • Encode — cố định</small></span></div><div class="skin"><span class="hletter">⚡</span><span><b>Giới hạn</b><br><small>Tối đa 20 skin / lần</small></span></div><div class="skin"><span class="hletter">ℹ</span><span><b>NghĩaLQ TV</b><br><small>Telegram Mini App chọn Hero/Skin</small></span></div></div>';stats()}
function sendSelection(){if(!selected.size){toast('⚠️ Chưa chọn skin');return}const payload={ids:[...selected.values()].map(x=>x.id),tuongs:[...selected.values()].map(x=>x.hero),skins:[...selected.values()].map(x=>x.name)};if(tg?.sendData){tg.sendData(JSON.stringify(payload));}else{navigator.clipboard?.writeText(JSON.stringify(payload));toast('Đã tạo dữ liệu chọn skin')} }
function toast(t){let x=document.createElement('div');x.className='toast';x.textContent=t;document.body.appendChild(x);setTimeout(()=>x.remove(),1800)}
load();
</script>
</body>
</html>
